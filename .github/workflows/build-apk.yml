name: Build CuteCut Pro Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js environment
      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup Java JDK 17 (Required for modern Android Gradle build tools)
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Setup Android SDK tools & Environment
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4b. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. Install NPM dependencies
      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps --no-audit

      # 6. Build Web / Vite distribution bundle
      - name: Build Web Application
        run: npm run build

      # 7. Initialize and Synchronize Capacitor Android project
      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found. Adding Android platform via Capacitor..."
            npx cap add android
          fi
          echo "Syncing web assets to Android platform..."
          npx cap sync android
          ls -la android || true

      # 8. Build Android Debug APK with Gradle
      - name: Build APK with Gradle
        run: |
          cd android
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            echo "gradlew wrapper not found, using system Gradle..."
            gradle assembleDebug --stacktrace --no-daemon
          fi

      # 9. Upload generated APK as GitHub Action Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CuteCut-Pro-Android-APK
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: error
