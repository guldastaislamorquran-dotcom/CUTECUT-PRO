name: Build CuteCut Pro Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js environment
      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Setup Java JDK 17 (Required for modern Android Gradle build tools)
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 4. Setup Android SDK tools & Environment
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4b. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. Install NPM dependencies
      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps --no-audit

      # 6. Build Web / Vite distribution bundle
      - name: Build Web Application
        run: npm run build

      # 7. Initialize and Synchronize Capacitor Android project
      - name: Sync Capacitor Android
        run: |
          # If android folder is missing or incomplete, create a fresh Capacitor Android project
          if [ ! -f "android/build.gradle" ]; then
            echo "Initializing fresh Capacitor Android platform..."
            rm -rf android
            npx cap add android
          fi
          
          # Inject Google AdMob App ID meta-data into AndroidManifest.xml if missing
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "com.google.android.gms.ads.APPLICATION_ID" "$MANIFEST"; then
            echo "Injecting AdMob App ID into AndroidManifest.xml..."
            sed -i '/<\/application>/i \        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-8898043565822840~4018462556"/>' "$MANIFEST"
          fi

          echo "Syncing web assets to Android platform..."
          npx cap sync android

      # 8. Build Android Debug APK with Gradle
      - name: Build APK with Gradle
        working-directory: android
        run: |
          # Accept any pending Android SDK licenses
          yes | sdkmanager --licenses || true
          
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      # 9. Upload generated APK as GitHub Action Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CuteCut-Pro-Android-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: error
