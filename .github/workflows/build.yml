name: CI/CD Build Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      SNAP_CREDS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS || secrets.SNAPCRAFT_TOKEN || secrets.SNAP_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install --include=optional --no-audit
          npm rebuild esbuild rollup lightningcss || true
          # Fallback check to ensure lightningcss and rollup work for current runner OS
          node -e "try { require('lightningcss'); console.log('lightningcss ready'); } catch(e) { console.log('Fetching platform lightningcss...'); require('child_process').execSync('npm install --no-save --no-audit lightningcss @rollup/rollup'); }"


      - name: Build Web Core Assets
        run: npm run build

      - name: Prepare Desktop Application Icons
        run: |
          node scripts/generate-icons.cjs

      - name: Cache Electron Binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            AppData/Local/electron/Cache
          key: v2-${{ runner.os }}-electron-${{ hashFiles('package.json') }}
          restore-keys: |
            v2-${{ runner.os }}-electron-

      - name: Install System Dependencies for Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg libfuse2 squashfs-tools snapd || sudo apt-get install -y fakeroot dpkg libfuse2t64 squashfs-tools snapd || true
          sudo snap install snapcraft --classic || true
          echo "/snap/bin" >> $GITHUB_PATH

      - name: Bundle Linux Binaries (DEB, AppImage & Snap)
        if: matrix.os == 'ubuntu-latest'
        run: |
          rm -rf dist-desktop
          npx electron-builder build --linux appimage deb snap --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Snap to Snap Store
        if: matrix.os == 'ubuntu-latest' && env.SNAP_CREDS != ''
        continue-on-error: true
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ env.SNAP_CREDS }}
        run: |
          export PATH="/snap/bin:$PATH"
          echo "=== Inspecting built Linux installers ==="
          ls -lh dist-desktop/ || true
          
          # Find the exact .snap filename
          SNAP_FILE=$(ls dist-desktop/*.snap 2>/dev/null | head -n 1 || true)
          
          if [ -n "$SNAP_FILE" ] && [ -f "$SNAP_FILE" ]; then
            echo "Found Snap package: $SNAP_FILE"
            SNAPCRAFT_BIN=$(which snapcraft || echo "/snap/bin/snapcraft")
            echo "Using Snapcraft CLI at: $SNAPCRAFT_BIN"
            
            echo "Uploading $SNAP_FILE to Canonical Snap Store (channels: edge, stable)..."
            $SNAPCRAFT_BIN upload "$SNAP_FILE" --release edge,stable || {
              echo "Standard upload failed, attempting with retry..."
              sleep 5
              $SNAPCRAFT_BIN upload "$SNAP_FILE" --release edge,stable
            }
            echo "Snap package publish process completed!"
          else
            echo "Warning: No .snap package found in dist-desktop directory."
          fi

      - name: Bundle Windows Executable Binaries (EXE)
        if: matrix.os == 'windows-latest'
        run: |
          rm -rf dist-desktop
          npx electron-builder build --win --x64 --publish never || (sleep 5 && rm -rf dist-desktop && npx electron-builder build --win --x64 --publish never)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Bundle macOS Executable Binaries (DMG)
        if: matrix.os == 'macos-latest'
        run: |
          rm -rf dist-desktop
          npx electron-builder build --mac -c.mac.identity=null --publish never || (sleep 5 && rm -rf dist-desktop && npx electron-builder build --mac -c.mac.identity=null --publish never)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          MAC_CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Build Artifacts Archive
        uses: actions/upload-artifact@v4
        with:
          name: CUTECUT-PRO-Installers-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            dist-desktop/*.exe
            dist-desktop/*.deb
            dist-desktop/*.AppImage
            dist-desktop/*.snap
            dist-desktop/*.dmg
            dist-desktop/

      - name: Publish Automated GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-desktop/*.exe
            dist-desktop/*.deb
            dist-desktop/*.AppImage
            dist-desktop/*.snap
            dist-desktop/*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
