name: CI/CD Build Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Core Assets
        run: npm run build

      - name: Prepare Desktop Application Icons
        run: |
          mkdir -p build/icons
          cp -r src-tauri/icons/* build/icons/ || true
          cp src-tauri/icons/512x512.png build/icon.png || true

      - name: Install System Dependencies for Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg libfuse2 || sudo apt-get install -y fakeroot dpkg libfuse2t64 || true

      - name: Bundle Linux Executable Binaries (DEB & AppImage)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npx electron-builder build --linux deb AppImage || true
          npx electron-packager . CUTECUT-PRO-SETUP --platform=linux --arch=x64 --out=dist-desktop --overwrite --asar || true

      - name: Bundle Windows Executable Binaries (EXE)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder build --win nsis portable || npx electron-packager . CUTECUT-PRO-SETUP --platform=win32 --arch=x64 --out=dist-desktop --overwrite --asar

      - name: Bundle macOS Executable Binaries (DMG)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder build --mac dmg || npx electron-packager . CUTECUT-PRO-SETUP --platform=darwin --arch=x64 --out=dist-desktop --overwrite --asar

      - name: Upload Build Artifacts Archive
        uses: actions/upload-artifact@v4
        with:
          name: CUTECUT-PRO-Stable-Binaries-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            dist-desktop/
            dist/

      - name: Publish Automated GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-desktop/*.exe
            dist-desktop/*.deb
            dist-desktop/*.AppImage
            dist-desktop/*.dmg
            dist-desktop/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

