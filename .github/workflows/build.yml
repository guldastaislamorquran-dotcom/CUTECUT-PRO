name: CI/CD Build Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Core Assets
        run: npm run build

      - name: Prepare Desktop Application Icons
        run: |
          mkdir -p build/icons
          if [ -d "build-resources" ]; then
            cp -r build-resources/* build/icons/ || true
            cp -n build-resources/icon.ico build/icon.ico || true
            cp -n build-resources/icon.icns build/icon.icns || true
            cp -n build-resources/icon.png build/icon.png || true
          fi

      - name: Install System Dependencies for Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg libfuse2 || sudo apt-get install -y fakeroot dpkg libfuse2t64 || true

      - name: Bundle Linux Executable Binaries (DEB & AppImage)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder build --linux deb AppImage --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Bundle Windows Executable Binaries (EXE)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder build --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          WIN_CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Bundle macOS Executable Binaries (DMG)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder build --mac dmg -c.mac.identity=null --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          MAC_CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Build Artifacts Archive
        uses: actions/upload-artifact@v4
        with:
          name: CUTECUT-PRO-Installers-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            dist-desktop/*.exe
            dist-desktop/*.deb
            dist-desktop/*.AppImage
            dist-desktop/*.dmg
            dist-desktop/

      - name: Publish Automated GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-desktop/*.exe
            dist-desktop/*.deb
            dist-desktop/*.AppImage
            dist-desktop/*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



